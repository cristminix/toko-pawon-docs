

############## HTTP SERVER ##############
server {
    listen 80;
    listen [::]:80;
    server_name docs.pawon.cloud;

    # Allow certbot renew via webroot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    
    location /toko-pawon/v1 {
        root /var/www/toko-pawon/docs/site;
    }

    location / {
        root /var/www/toko-pawon/docs;
    }

}

